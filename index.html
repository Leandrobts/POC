<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 13.52 - Userland Diagnostic v3</title>

<style>
body {
    font-family: monospace;
    background: #111;
    color: #ddd;
    margin: 16px;
}

h1 {
    font-size: 20px;
}

#log {
    white-space: pre-wrap;
    border: 1px solid #555;
    padding: 12px;
    min-height: 420px;
    max-height: 75vh;
    overflow: auto;
}

.ok   { color: #9f9; }
.warn { color: #fd6; }
.bad  { color: #f88; }
.info { color: #9cf; }

button {
    font: inherit;
    padding: 8px 12px;
    margin-right: 8px;
}
</style>
</head>

<body>

<h1>PS4 13.52 — Userland Diagnostic v3</h1>

<button id="run">Run diagnostic</button>
<button id="clear">Clear</button>

<div id="log"></div>

<script>
(function () {

"use strict";

var out = document.getElementById("log");
var seq = 0;

var results = {
    environment: false,
    capabilities: 0,
    scripts: 0,
    symbols: 0,
    offsets: false,
    worker: false,
    sharedWorker: false,
    safeStop: false
};

function now() {
    try {
        return Date.now();
    } catch (e) {
        return 0;
    }
}

function err(e) {
    try {
        return (e && e.name ? e.name + ": " : "") +
               (e && e.message ? e.message : String(e));
    } catch (_) {
        return "unknown error";
    }
}

function esc(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function log(msg, cls) {

    var d = document.createElement("div");

    d.textContent =
        "[" + (++seq) + "] " + String(msg);

    if (cls)
        d.className = cls;

    out.appendChild(d);
    out.scrollTop = out.scrollHeight;

    saveLast();
}

function section(name) {
    log("");
    log("================================");
    log(name);
    log("================================");
}

function saveLast() {

    try {

        localStorage.setItem(
            "ps4_1352_diag_v3_last",
            out.innerText.slice(-16000)
        );

    } catch (e) {
    }
}

function clearLog() {

    out.textContent = "";
    seq = 0;

    try {
        localStorage.removeItem(
            "ps4_1352_diag_v3_last"
        );
    } catch (e) {
    }
}

function capability(name, fn) {

    try {

        var ok = !!fn();

        results.capabilities++;

        log(
            (ok ? "[OK] " : "[NO] ") + name,
            ok ? "ok" : "warn"
        );

        return ok;

    } catch (e) {

        log(
            "[ERROR] " + name + " - " + err(e),
            "bad"
        );

        return false;
    }
}

function getFirmware() {

    var ua = "";

    try {
        ua = navigator.userAgent || "";
    } catch (e) {
    }

    var m = ua.match(
        /PlayStation\s+4\/([0-9.]+)/i
    );

    return {
        ua: ua,
        firmware: m ? m[1] : "unknown"
    };
}

function findGlobal(names) {

    for (var i = 0; i < names.length; i++) {

        try {

            if (typeof window[names[i]] !== "undefined")
                return names[i];

        } catch (e) {
        }
    }

    return null;
}

function loadScript(src, label) {

    return new Promise(function (resolve) {

        var script =
            document.createElement("script");

        var start = now();
        var finished = false;

        function finish(ok, message) {

            if (finished)
                return;

            finished = true;

            var elapsed = now() - start;

            if (ok) {

                results.scripts++;

                log(
                    "[OK] " + label +
                    " loaded (" + elapsed + " ms)",
                    "ok"
                );

            } else {

                log(
                    "[FAIL] " + label +
                    " - " + message +
                    " (" + elapsed + " ms)",
                    "bad"
                );
            }

            resolve(ok);
        }

        script.src =
            src +
            "?diag1352v3=" +
            Date.now() +
            "_" +
            Math.random()
                .toString(16)
                .slice(2);

        script.async = false;

        script.onload = function () {
            finish(true, "");
        };

        script.onerror = function () {
            finish(false, "script load/parse error");
        };

        try {

            document.head.appendChild(script);

        } catch (e) {

            finish(false, err(e));
        }
    });
}

function checkSymbol(label, names) {

    var found = findGlobal(names);

    if (found) {

        results.symbols++;

        log(
            "[FOUND] " +
            label +
            " -> window." +
            found,
            "ok"
        );

        return true;
    }

    log(
        "[NOT EXPORTED] " +
        label,
        "warn"
    );

    return false;
}

function safeOffsetInspection(obj) {

    if (!obj) {

        log(
            "[WARN] Offset object unavailable",
            "warn"
        );

        return false;
    }

    try {

        var keys = Object.keys(obj);

        log(
            "[OK] Offset object accessible",
            "ok"
        );

        log(
            "[INFO] Offset key count: " +
            keys.length,
            "info"
        );

        var interesting = [
            "fw_status",
            "wk_JSFunction_m_function",
            "wk_expm1_builtin",
            "wk___imp___error",
            "k__error"
        ];

        for (var i = 0; i < interesting.length; i++) {

            var k = interesting[i];

            try {

                if (typeof obj[k] !== "undefined") {

                    log(
                        "[OFFSET] " +
                        k +
                        " = " +
                        String(obj[k]),
                        "info"
                    );

                } else {

                    log(
                        "[MISSING] " + k,
                        "warn"
                    );
                }

            } catch (e) {

                log(
                    "[ERROR] offset " +
                    k +
                    " - " +
                    err(e),
                    "bad"
                );
            }
        }

        return true;

    } catch (e) {

        log(
            "[FAIL] Offset inspection - " +
            err(e),
            "bad"
        );

        return false;
    }
}

function safeWorkerTest() {

    return new Promise(function (resolve) {

        if (typeof Worker !== "function") {

            log(
                "[SKIP] Worker unavailable",
                "warn"
            );

            resolve(false);
            return;
        }

        try {

            var source =
                "self.onmessage=function(e){" +
                "self.postMessage('pong')" +
                "}";

            var blob =
                new Blob(
                    [source],
                    { type: "application/javascript" }
                );

            var url =
                URL.createObjectURL(blob);

            var w = new Worker(url);

            var done = false;

            var timer = setTimeout(function () {

                if (done)
                    return;

                done = true;

                try {
                    w.terminate();
                } catch (e) {
                }

                try {
                    URL.revokeObjectURL(url);
                } catch (e) {
                }

                log(
                    "[TIMEOUT] Worker response",
                    "warn"
                );

                resolve(false);

            }, 1500);

            w.onmessage = function (e) {

                if (done)
                    return;

                done = true;

                clearTimeout(timer);

                try {
                    w.terminate();
                } catch (x) {
                }

                try {
                    URL.revokeObjectURL(url);
                } catch (x) {
                }

                if (e.data === "pong") {

                    log(
                        "[OK] Worker create/message/terminate",
                        "ok"
                    );

                    results.worker = true;
                    resolve(true);

                } else {

                    log(
                        "[WARN] Worker returned unexpected data",
                        "warn"
                    );

                    resolve(false);
                }
            };

            w.onerror = function () {

                if (done)
                    return;

                done = true;

                clearTimeout(timer);

                try {
                    w.terminate();
                } catch (x) {
                }

                try {
                    URL.revokeObjectURL(url);
                } catch (x) {
                }

                log(
                    "[FAIL] Worker error",
                    "bad"
                );

                resolve(false);
            };

            w.postMessage("ping");

        } catch (e) {

            log(
                "[FAIL] Worker test - " +
                err(e),
                "bad"
            );

            resolve(false);
        }
    });
}

function safeSharedWorkerTest() {

    return new Promise(function (resolve) {

        if (typeof SharedWorker !== "function") {

            log(
                "[SKIP] SharedWorker unavailable",
                "warn"
            );

            resolve(false);
            return;
        }

        try {

            var source =
                "onconnect=function(e){" +
                "var p=e.ports[0];" +
                "p.onmessage=function(x){" +
                "p.postMessage('pong')" +
                "}" +
                "}";

            var blob =
                new Blob(
                    [source],
                    { type: "application/javascript" }
                );

            var url =
                URL.createObjectURL(blob);

            var sw =
                new SharedWorker(
                    url,
                    "ps4_diag_1352_v3_" +
                    Date.now()
                );

            var port = sw.port;
            var done = false;

            var timer = setTimeout(function () {

                if (done)
                    return;

                done = true;

                try {
                    port.close();
                } catch (e) {
                }

                try {
                    URL.revokeObjectURL(url);
                } catch (e) {
                }

                log(
                    "[TIMEOUT] SharedWorker response",
                    "warn"
                );

                resolve(false);

            }, 1500);

            port.onmessage = function (e) {

                if (done)
                    return;

                done = true;

                clearTimeout(timer);

                try {
                    port.close();
                } catch (x) {
                }

                try {
                    URL.revokeObjectURL(url);
                } catch (x) {
                }

                if (e.data === "pong") {

                    log(
                        "[OK] SharedWorker create/message/close",
                        "ok"
                    );

                    results.sharedWorker = true;
                    resolve(true);

                } else {

                    log(
                        "[WARN] SharedWorker unexpected data",
                        "warn"
                    );

                    resolve(false);
                }
            };

            port.start();
            port.postMessage("ping");

        } catch (e) {

            log(
                "[FAIL] SharedWorker test - " +
                err(e),
                "bad"
            );

            resolve(false);
        }
    });
}

function basicRuntimeChecks() {

    section("RUNTIME CAPABILITIES");

    capability(
        "Proxy",
        function () {
            return typeof Proxy === "function";
        }
    );

    capability(
        "ArrayBuffer",
        function () {
            return typeof ArrayBuffer === "function";
        }
    );

    capability(
        "Uint8Array",
        function () {
            return typeof Uint8Array === "function";
        }
    );

    capability(
        "Uint32Array",
        function () {
            return typeof Uint32Array === "function";
        }
    );

    capability(
        "DataView",
        function () {
            return typeof DataView === "function";
        }
    );

    capability(
        "BigInt",
        function () {
            return typeof BigInt === "function";
        }
    );

    capability(
        "Worker",
        function () {
            return typeof Worker === "function";
        }
    );

    capability(
        "SharedWorker",
        function () {
            return typeof SharedWorker === "function";
        }
    );

    capability(
        "history",
        function () {
            return !!window.history;
        }
    );

    capability(
        "history.replaceState",
        function () {
            return !!(
                window.history &&
                typeof history.replaceState === "function"
            );
        }
    );

    capability(
        "history.pushState",
        function () {
            return !!(
                window.history &&
                typeof history.pushState === "function"
            );
        }
    );
}

async function run() {

    clearLog();

    section("PS4 13.52 USERLAND DIAGNOSTIC v3");

    log(
        "[INFO] Safe diagnostic mode",
        "info"
    );

    log(
        "[INFO] No primitive execution",
        "info"
    );

    log(
        "[INFO] No arbitrary read/write",
        "info"
    );

    log(
        "[INFO] No native execution",
        "info"
    );

    log(
        "[INFO] No kernel stage",
        "info"
    );

    section("ENVIRONMENT");

    var env = getFirmware();

    log(
        "[INFO] UA: " + env.ua,
        "info"
    );

    log(
        "[INFO] Firmware: " + env.firmware,
        "info"
    );

    if (env.firmware === "13.52") {

        log(
            "[OK] Firmware 13.52 detected",
            "ok"
        );

        results.environment = true;

    } else {

        log(
            "[WARN] This diagnostic targets firmware 13.52",
            "warn"
        );
    }

    basicRuntimeChecks();

    section("USERLAND SUPPORT FILES");

    var files = [

        [
            "int64.js",
            "Int64 support"
        ],

        [
            "ps4_offsets.js",
            "PS4 offsets"
        ],

        [
            "core.js",
            "WebKit primitive core"
        ],

        [
            "mem.js",
            "memory helper layer"
        ],

        [
            "rpc_worker.js",
            "RPC worker support"
        ]
    ];

    for (var i = 0; i < files.length; i++) {

        await loadScript(
            files[i][0],
            files[i][1]
        );
    }

    log(
        "[INFO] Successfully loaded: " +
        results.scripts +
        "/" +
        files.length,
        "info"
    );

    section("SYMBOL DISCOVERY");

    checkSymbol(
        "Int64",
        [
            "Int64",
            "int64"
        ]
    );

    checkSymbol(
        "Offsets",
        [
            "offsets",
            "off",
            "ps4_offsets"
        ]
    );

    checkSymbol(
        "Primitive entry",
        [
            "establishPrimitive",
            "startAttempt"
        ]
    );

    checkSymbol(
        "Memory helper leakval",
        [
            "leakval"
        ]
    );

    checkSymbol(
        "Memory helper read8",
        [
            "read8"
        ]
    );

    checkSymbol(
        "Memory helper write8",
        [
            "write8"
        ]
    );

    checkSymbol(
        "RPC armPivot",
        [
            "armPivot"
        ]
    );

    checkSymbol(
        "RPC fire",
        [
            "fire"
        ]
    );

    section("OFFSET OBJECT");

    var offName =
        findGlobal([
            "offsets",
            "off",
            "ps4_offsets"
        ]);

    if (offName) {

        results.offsets =
            safeOffsetInspection(
                window[offName]
            );

    } else {

        log(
            "[WARN] No exported offset object",
            "warn"
        );
    }

    section("SAFE WORKER TEST");

    await safeWorkerTest();

    section("SAFE SHAREDWORKER TEST");

    await safeSharedWorkerTest();

    section("NON-INVASIVE JAVASCRIPT TESTS");

    capability(
        "Proxy construction",
        function () {

            var target = {};

            var p = new Proxy(
                target,
                {
                    get: function (t, k) {
                        return t[k];
                    }
                }
            );

            p.test = 123;

            return p.test === 123;
        }
    );

    capability(
        "ArrayBuffer/DataView",
        function () {

            var b =
                new ArrayBuffer(16);

            var d =
                new DataView(b);

            d.setUint32(
                0,
                0x13521352,
                true
            );

            return d.getUint32(
                0,
                true
            ) === 0x13521352;
        }
    );

    capability(
        "history state API",
        function () {

            if (!history ||
                typeof history.replaceState !== "function")
                return false;

            history.replaceState(
                {
                    diag: "PS4-13.52-v3"
                },
                "",
                location.href
            );

            return true;
        }
    );

    section("STOP POINT");

    log(
        "[STOP] Safe compatibility diagnostic completed",
        "ok"
    );

    log(
        "[RESULT] Firmware detected: " +
        (results.environment ? "13.52" : "OTHER/UNKNOWN"),
        results.environment ? "ok" : "warn"
    );

    log(
        "[RESULT] Scripts loaded: " +
        results.scripts +
        "/5",
        results.scripts === 5 ? "ok" : "warn"
    );

    log(
        "[RESULT] Symbols discovered: " +
        results.symbols,
        "info"
    );

    log(
        "[RESULT] Offset object: " +
        (results.offsets ? "available" : "not exported"),
        results.offsets ? "ok" : "warn"
    );

    log(
        "[RESULT] Worker: " +
        (results.worker ? "working" : "failed/unavailable"),
        results.worker ? "ok" : "warn"
    );

    log(
        "[RESULT] SharedWorker: " +
        (results.sharedWorker ? "working" : "failed/unavailable"),
        results.sharedWorker ? "ok" : "warn"
    );

    log("");

    log(
        "[STOP] establishPrimitive() NOT executed",
        "info"
    );

    log(
        "[STOP] leakval/read8/write8 NOT executed",
        "info"
    );

    log(
        "[STOP] armPivot/fire NOT executed",
        "info"
    );

    log(
        "[STOP] chain_lapse.js NOT loaded",
        "info"
    );

    log(
        "[STOP] chain_poops.js NOT loaded",
        "info"
    );

    log(
        "[STOP] payload.bin NOT loaded",
        "info"
    );

    log("");

    log(
        "[IMPORTANT] PASS means the corresponding interface " +
        "was accepted by the browser. It does NOT prove " +
        "WebKit exploitability.",
        "warn"
    );

    results.safeStop = true;

    saveLast();
}

document.getElementById("run").onclick =
    function () {

        run().catch(function (e) {

            log(
                "[FATAL] " + err(e),
